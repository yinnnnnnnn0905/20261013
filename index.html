<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 設定文字編碼 -->
  <meta charset="UTF-8">

  <!-- 設定響應式網頁 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- 設定網頁標題 -->
  <title>台北捷運選擇題測驗</title>

  <!-- 載入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- 載入 Google Fonts 字型伺服器 -->
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <!-- 載入 Noto Sans Hong Kong -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- 載入 p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

  <!-- 載入 sketch.js -->
  <script src="sketch.js" defer></script>

  <!-- 設定網頁樣式 -->
  <style>
    /* 讓所有元素使用統一盒模型 */
    * {
      box-sizing: border-box;
    }

    /* 設定 html 尺寸 */
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* 設定 body 尺寸與背景 */
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4e285;
      font-family: "Noto Sans HK", sans-serif;
    }

    /* 讓畫布不產生額外空白 */
    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <!-- p5.js 會自動將畫布放入 body -->
</body>
</html>
